# CodeQL security scanning. This is the workflow form of GitHub's default
# setup, needed because default setup only scans the default branch (main)
# and development here happens on fork-testing.
name: CodeQL

on:
  push:
    branches: [fork-testing]
  pull_request:
    branches: [fork-testing]
  # No schedule: GitHub runs scheduled workflows only from the default branch
  # (main), so a cron here would never fire. Run it by hand to rescan with
  # newer CodeQL queries.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
